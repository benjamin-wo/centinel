[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "centinel"

version = "0.1.0"
description = "Finance-focused agentic assistant — Telegram bot and web cockpit with LangGraph orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

authors = [
    { name = "Antigravity Engineering", email = "assistant@example.com" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlmodel>=0.0.16",
    "sqlalchemy>=2.0.28",
    "greenlet>=3.0.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "cryptography>=42.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "google-genai>=1.0.0",  # Modern Google GenAI SDK for Gemini & Imagen 3
    "langchain-openai>=0.2.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "apscheduler>=3.10.4",
    "python-telegram-bot>=21.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "tzdata>=2024.1",
    "langgraph-checkpoint-postgres==3.1.2",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9",
    "pytest-asyncio>=0.23.5,<1",
    "httpx>=0.27.0",
    "hypothesis>=6.165.10",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "core*", "capabilities*", "orchestrator*", "domain*"]
